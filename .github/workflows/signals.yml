name: Senales oro

# El horario NO lo da GitHub (su "schedule" se atrasaba horas): lo da cron-job.org,
# que llama a este workflow con workflow_dispatch.
# Para cero retraso, programa cron-job.org para disparar UN POCO ANTES del cierre de cada vela de 15 min
# (minutos :13, :28, :43 y :58). El bot espera al cierre exacto + 3 s y avisa en ese instante.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = revisar senales V8 | test = mensaje de prueba de Telegram | capital = probar conexion con Capital.com | noticias = noticias rojas de USD de la semana | backtest = medidor identico al del Pine | h4lab = laboratorio de variantes del perfil H4 | history = senales del historial | explicar = por que cada una de las ultimas velas dio o no senal | velas = ultimas velas para comparar"
        type: choice
        default: capital
        options:
          - capital
          - test
          - backtest
          - h4lab
          - noticias
          - velas
          - history
          - explicar
          - normal
      source:
        description: "Fuente de datos para esta corrida manual"
        type: choice
        default: capital
        options:
          - capital
          - twelvedata
      explain_bars:
        description: "Solo para el modo explicar: cuantas velas cerradas revisar (8 por defecto; pon 100 para ver desde ayer)"
        type: string
        default: "8"
      tf:
        description: "Temporalidad para capital / velas / history (en minutos: 15 = M15, 60 = H1, 240 = H4). El modo normal revisa las tres."
        type: choice
        default: "15"
        options:
          - "15"
          - "60"
          - "240"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar senales
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV }}
          DATA_SOURCE: ${{ github.event.inputs.source || vars.DATA_SOURCE || 'capital' }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES || '15,60,240' }}
          CLOSE_MARGIN_S: ${{ vars.CLOSE_MARGIN_S || '3' }}
          LOOKBACK_BARS: ${{ vars.LOOKBACK_BARS || '2' }}
          MAX_AGE_MIN: ${{ vars.MAX_AGE_MIN || '10' }}
          MAX_AGE_H1: ${{ vars.MAX_AGE_H1 || '20' }}
          MAX_AGE_H4: ${{ vars.MAX_AGE_H4 || '30' }}
          USE_FVG_TRIG: ${{ vars.USE_FVG_TRIG || '1' }}
          USE_SQUEEZE: ${{ vars.USE_SQUEEZE || '1' }}
          H4_SOURCE: ${{ vars.H4_SOURCE || 'h1' }}
          H4_ANCHOR: ${{ vars.H4_ANCHOR || '18' }}
          LAB_WINDOWS: ${{ vars.LAB_WINDOWS || '24' }}
          VERIFY_S: ${{ vars.VERIFY_S || '8' }}
          EXPLAIN_BARS: ${{ github.event.inputs.explain_bars || vars.EXPLAIN_BARS || '8' }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          TF: ${{ github.event.inputs.tf || '15' }}
        run: python signal_bot.py --mode "$MODE" --tf "$TF"

      - name: Guardar estado
        if: always()
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add state.json
            git commit -m "estado de avisos"
            git pull --rebase origin main
            git push || (git pull --rebase origin main && git push)
          fi
