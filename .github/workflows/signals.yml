name: Senales oro

# El horario NO lo da GitHub (su "schedule" se atrasaba horas): lo da cron-job.org,
# que llama a este workflow con workflow_dispatch.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = revisar senales | test = mensaje de prueba de Telegram | capital = probar conexion con Capital.com | history = senales del historial | velas = ultimas velas para comparar"
        type: choice
        default: capital
        options:
          - capital
          - test
          - velas
          - history
          - normal
      source:
        description: "Fuente de datos para esta corrida manual"
        type: choice
        default: capital
        options:
          - capital
          - twelvedata
      tf:
        description: "Temporalidad para capital / velas / history (en minutos: 15 = M15, 30 = M30, 60 = H1). El modo normal revisa las tres."
        type: choice
        default: "15"
        options:
          - "15"
          - "30"
          - "60"

permissions:
  contents: write

concurrency:
  group: signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar senales
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          CAPITAL_API_KEY: ${{ secrets.CAPITAL_API_KEY }}
          CAPITAL_IDENTIFIER: ${{ secrets.CAPITAL_IDENTIFIER }}
          CAPITAL_PASSWORD: ${{ secrets.CAPITAL_PASSWORD }}
          CAPITAL_ENV: ${{ vars.CAPITAL_ENV }}
          DATA_SOURCE: ${{ github.event.inputs.source || vars.DATA_SOURCE || 'twelvedata' }}
          TIMEFRAMES: ${{ vars.TIMEFRAMES || '15,30,60' }}
          CLOSE_MARGIN_S: ${{ vars.CLOSE_MARGIN_S || '3' }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
          TF: ${{ github.event.inputs.tf || '15' }}
        run: python signal_bot.py --mode "$MODE" --tf "$TF"

      - name: Guardar estado
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "signal-bot"
            git config user.email "signal-bot@users.noreply.github.com"
            git add state.json
            git commit -m "estado de avisos"
            git pull --rebase origin main
            git push
          fi
